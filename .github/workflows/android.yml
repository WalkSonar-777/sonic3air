
name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719

      - name: Verificar SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager
          sdkmanager --version

      - name: Aceptar licencias
        run: |
          yes | sdkmanager --licenses || true

      - name: Instalar componentes Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Comprobar proyecto
        run: |
          ls -la Oxygen/sonic3air/build/_android
          test -f Oxygen/sonic3air/build/_android/gradlew

      - name: Preparar Gradle
        working-directory: Oxygen/sonic3air/build/_android
        run: chmod +x gradlew

      - name: Compilar APK
        working-directory: Oxygen/sonic3air/build/_android
        run: ./gradlew assembleDebug --stacktrace

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sonic3air-android-apk
          path: Oxygen/sonic3air/build/_android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
