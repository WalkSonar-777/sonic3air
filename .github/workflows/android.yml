
name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Java y Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar CMake y NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Compilar APK de prueba
        working-directory: Oxygen/sonic3air/build/_android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Publicar APK si se generó
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Oxygen/sonic3air/build/_android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
