
name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceptar licencias Android
        run: yes | sdkmanager --licenses

      - name: Instalar SDK, CMake y NDK
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Comprobar archivos del proyecto
        run: |
          test -f Oxygen/sonic3air/build/_android/gradlew
          test -f Oxygen/sonic3air/build/_android/settings.gradle || \
          test -f Oxygen/sonic3air/build/_android/settings.gradle.kts

      - name: Preparar Gradle
        working-directory: Oxygen/sonic3air/build/_android
        run: chmod +x gradlew

      - name: Compilar APK de prueba
        working-directory: Oxygen/sonic3air/build/_android
        run: ./gradlew assembleDebug --stacktrace

      - name: Guardar APK generado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sonic3air-android-apk
          path: Oxygen/sonic3air/build/_android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
